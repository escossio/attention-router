name: attention-router-roc-goaccess

services:
  roc-goaccess:
    build: .
    image: attention-router-roc-goaccess:v1
    container_name: andy-roc-goaccess
    user: "10001:4"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 80
    mem_limit: 192m
    cpus: 0.6
    environment:
      GOACCESS_WS_URL: ${GOACCESS_WS_URL:?public websocket endpoint required}
      GOACCESS_LOG_FILE: /logs/attention-router-client-api-access.log
      GOACCESS_REPORT_FILE: /reports/index.html
    volumes:
      - type: bind
        source: ${GOACCESS_LOG_DIR:?Apache log directory must be configured}
        target: /logs
        read_only: true
      - type: bind
        source: ${GOACCESS_REPORT_DIR:?report directory must be configured}
        target: /reports
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=24m,uid=10001,gid=4,mode=1777
    ports:
      - "${GOACCESS_LISTEN_HOST:-127.0.0.1}:${GOACCESS_WS_PORT:-7890}:7890"
    healthcheck:
      test: ["CMD", "test", "-s", "/reports/index.html"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - goaccess

  roc-goaccess-web:
    image: python:3.13-alpine
    container_name: andy-roc-goaccess-web
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 45
    mem_limit: 72m
    cpus: 0.3
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-B", "-m", "http.server", "7891", "--bind", "0.0.0.0", "--directory", "/reports"]
    volumes:
      - type: bind
        source: ${GOACCESS_REPORT_DIR:?report directory must be configured}
        target: /reports
        read_only: true
    ports:
      - "${GOACCESS_LISTEN_HOST:-127.0.0.1}:${GOACCESS_HTTP_PORT:-7891}:7891"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:7891/index.html',timeout=3); assert r.status==200"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 15s
    networks:
      - goaccess

networks:
  goaccess:
    driver: bridge
