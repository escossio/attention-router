services:
  flow-reader:
    build: .
    image: attention-router-grafana-flow:v1
    container_name: andy-roc-flow-reader
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    environment:
      TEMPO_URL: ${TEMPO_URL:-http://roc-tempo:3200}
    networks:
      monitoring:
        aliases: [roc-flow-reader]
networks:
  monitoring:
    external: true
    name: ${ROC_MONITORING_NETWORK:-andy-roc-monitoring}
