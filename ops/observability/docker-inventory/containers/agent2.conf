# Engine inventory only. No host OS agent, no active remote checks, no host ports.
LogType=console
Server=roc-zabbix-server
Hostname=Andy Engine - AGT01
ListenIP=0.0.0.0
ListenPort=10050
Timeout=20
Include=/etc/zabbix/zabbix_agent2.d/roc-docker-inventory.conf
Include=/etc/zabbix/zabbix_agent2.d/plugins.d/roc-docker.conf
