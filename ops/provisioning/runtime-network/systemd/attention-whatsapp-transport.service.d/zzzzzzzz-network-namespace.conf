[Unit]
Requires=andy-transport-netns.service andy-transport-cdp-proxy.service
After=andy-transport-netns.service andy-transport-cdp-proxy.service

[Service]
NetworkNamespacePath=/run/netns/andy-transport
BindReadOnlyPaths=/etc/attention-router/resolv-transport.conf:/etc/resolv.conf
EnvironmentFile=
EnvironmentFile=/etc/attention-router/agt-production.env
EnvironmentFile=/etc/attention-router/agt-network-namespace.env
