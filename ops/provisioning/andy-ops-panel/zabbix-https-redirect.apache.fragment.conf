# Insert inside the existing zabbix.escossio.com VirtualHost before Basic Auth.
# Do not change the Cloudflare tunnel's HTTP origin; it reports visitor
# scheme in X-Forwarded-Proto. Only redirect insecure visitor requests.
RewriteEngine On
RewriteCond %{HTTP:X-Forwarded-Proto} ^http$ [NC]
RewriteRule ^ https://zabbix.escossio.com%{REQUEST_URI} [R=308,L,NE]
