# Example replacement for mgmt-agt01.escossio.com Apache vhost.
# Keep Cloudflare -> Apache ingress unchanged. Cutover only after localhost smoke,
# authentication and WebSocket tests; maintain existing vhost backup for rollback.
<VirtualHost *:80>
    ServerName mgmt-agt01.escossio.com
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    RequestHeader unset Proxy

    <Location />
        AuthType Basic
        AuthName "AGT01 Management"
        AuthUserFile /etc/apache2/.htpasswd-novnc
        Require valid-user
    </Location>

    # WebSocket before HTTP and before the portal catch-all.
    ProxyPass        /observability/goaccess/ws/ ${MGMT_GOACCESS_WS_ORIGIN}/ retry=0 timeout=3600
    ProxyPassReverse /observability/goaccess/ws/ ${MGMT_GOACCESS_WS_ORIGIN}/

    # GoAccess is generated by a runtime that embeds its INTERNAL 7890 WS port.
    # Rewriting the client-side port is required when the public port is 443.
    <Location /observability/goaccess/>
        AddOutputFilterByType SUBSTITUTE text/html
        SubstituteMaxLineLength 5m
        Substitute "s|port\": 7890|port\": 443|n"
    </Location>
    ProxyPass        /observability/goaccess/ ${MGMT_GOACCESS_HTTP_ORIGIN}/ retry=0 timeout=60
    ProxyPassReverse /observability/goaccess/ ${MGMT_GOACCESS_HTTP_ORIGIN}/

    # Dozzle candidate serves the full prefix through DOZZLE_BASE; do NOT strip it.
    # SSE needs unbuffered streaming and a generous idle timeout.
    ProxyPass        /observability/dozzle/ ${MGMT_DOZZLE_ORIGIN}/observability/dozzle/ retry=0 timeout=3600
    ProxyPassReverse /observability/dozzle/ ${MGMT_DOZZLE_ORIGIN}/observability/dozzle/

    ProxyPass        / ${MGMT_PORTAL_ORIGIN}/ retry=0 timeout=30
    ProxyPassReverse / ${MGMT_PORTAL_ORIGIN}/

    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/mgmt-agt01-error.log
    CustomLog ${APACHE_LOG_DIR}/mgmt-agt01-access.log combined
</VirtualHost>
