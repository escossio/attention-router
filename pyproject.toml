[project]
name = "attention-router"
version = "0.1.0"
description = "Policy-controlled conversational routing for contextual personal agents"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.13.2",
  "fastapi==0.112.2",
  "jinja2==3.1.4",
  "jsonschema[format-nongpl]==4.26.0",
  "openai==3.9.0",
  "openai-agents==0.22.1",
  "opentelemetry-api==1.27.0",
  "opentelemetry-sdk==1.27.0",
  "opentelemetry-exporter-otlp-proto-http==1.27.0",
  "psycopg[binary]==3.2.1",
  "pydantic-settings==2.5.2",
  "python-multipart==0.0.9",
  "PyYAML==6.0.2",
  "sqlalchemy==2.0.32",
  "uvicorn[standard]==0.31.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.2",
  "pytest==8.3.2",
  "ruff==0.6.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not postgres'"
markers = [
  "postgres: integration tests that require PostgreSQL",
]

[tool.setuptools.packages.find]
include = ["attention_router*"]

[tool.ruff]
line-length = 100
target-version = "py311"