[project]
name = "attention-router"
version = "0.1.0"
description = "Policy-controlled conversational routing for contextual personal agents"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.19.2",
  "fastapi==0.141.1",
  "jinja2==3.1.6",
  "jsonschema[format-nongpl]==4.26.0",
  "openai==2.11.0",
  "openai-agents==0.22.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "PyYAML==6.0.3",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.2",
  "ruff==0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not postgres'"
markers = [
  "postgres: integration tests that require PostgreSQL",
]

[tool.setuptools.packages.find]
include = ["attention_router*"]

[tool.ruff]
line-length = 100
target-version = "py311"
