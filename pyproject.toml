[project]
name = "attention-router"
version = "0.1.0"
description = "Policy-controlled conversational routing for contextual personal agents"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.20.0",
  "cryptography==50.0.2",
  "fastapi==0.142.2",
  "google-auth==2.59.1",
  "jinja2==3.1.6",
  "jsonschema[format-nongpl]==4.26.0",
  "openai==3.14.0",
  "openai-agents==0.22.2",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "PyYAML==6.0.3",
  "sqlalchemy==2.1.3",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not postgres'"
markers = [
  "postgres: integration tests that require PostgreSQL",
]

[tool.setuptools.packages.find]
include = ["attention_router*"]

[tool.ruff]
line-length = 100
target-version = "py311"