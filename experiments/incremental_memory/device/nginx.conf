pid /tmp/nginx.pid;
events { worker_connections 32; }
http {
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 16k;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  limit_req_zone $binary_remote_addr zone=lab:1m rate=5r/s;
  upstream contextual { server unix:/http/app.sock; }
  server {
    listen 8443 ssl;
    ssl_certificate /run/lab-tls/server.crt;
    ssl_certificate_key /run/lab-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Protected file must contain only the approved device/VPN source allow rules.
    include /run/lab-tls/allowed-device.conf;
    deny all;
    limit_req zone=lab burst=10 nodelay;
    location /api/v1/ {
      proxy_pass http://contextual;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_buffering off;
      add_header Cache-Control no-store always;
    }
    location / { return 404; }
  }
}
