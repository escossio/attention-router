# INERT TEMPLATE: no ports, no auto-restart, no operational resources created.
name: andy-memory-m2
services:
  core:
    profiles: [authorized-device]
    image: ${LAB_CORE_IMAGE:?exact-source image pinned by digest required}
    command: [uvicorn, experiments.incremental_memory.device.runtime:load_app, --factory, --uds, /http/app.sock, --no-access-log]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    environment:
      ANDY_LAB_CONFIG: /run/lab/config.json
      HTTPS_PROXY: ${LAB_VERIFIER_PROXY:?approved restricted certificate-fetch proxy required}
    volumes:
      - ${LAB_PRIVATE_CONFIG:?protected experimental file required}:/run/lab/config.json:ro
      - http:/http
      - pgsocket:/socket
    networks: [lab]
    tmpfs: [/tmp]
  db:
    profiles: [authorized-device]
    image: ${LAB_POSTGRES_IMAGE:?PostgreSQL 16.15 Alpine digest required}
    network_mode: none
    command: [postgres, -c, listen_addresses=, -c, unix_socket_directories=/socket, -c, unix_socket_permissions=0770]
    environment:
      POSTGRES_PASSWORD_FILE: /run/lab/db-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/socket
      - ${LAB_DB_PASSWORD_FILE:?exclusive experimental secret required}:/run/lab/db-password:ro
    mem_limit: 512m
    cpus: 1
    restart: "no"
  tls:
    profiles: [authorized-device]
    image: ${LAB_TLS_IMAGE:?reviewed unprivileged TLS image digest required}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - http:/http:ro
      - ${LAB_TLS_DIRECTORY:?dedicated certificates and allowlist required}:/run/lab-tls:ro
    tmpfs: [/tmp]
    networks: [lab]
# No static addresses, external networks, productive volumes or Docker socket.
networks:
  lab:
    internal: true
volumes:
  http: {}
  pgdata: {}
  pgsocket: {}
