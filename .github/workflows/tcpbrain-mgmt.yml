name: TCPBrain MGMT tests
on:
  pull_request:
    paths:
      - 'ops/provisioning/andy-ops-panel/**'
      - 'tests/test_tcpbrain_mgmt*.py'
      - '.github/workflows/tcpbrain-mgmt.yml'
  push:
    branches: [main]
    paths:
      - 'ops/provisioning/andy-ops-panel/**'
      - 'tests/test_tcpbrain_mgmt*.py'
      - '.github/workflows/tcpbrain-mgmt.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -p 'test_tcpbrain_mgmt*.py' -v
      - run: node --check ops/provisioning/andy-ops-panel/tcpbrain-mgmt.js
      - run: bash -n ops/provisioning/andy-ops-panel/install.sh
