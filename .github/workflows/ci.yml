name: Public CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          for source in $(grep -rl --include='*.list' --include='*.sources' 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null || true); do
            sudo rm -f "$source"
          done
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m compileall -q attention_router tests
      - name: Check generated integration SDK types and schemas
        run: python scripts/generate_integration_sdks.py --check
      - name: Build and test the standalone Python SDK wheel
        run: python scripts/test_python_integration_sdk.py
      - run: python -m pytest -q
  transport-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: whatsapp-transport-local
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            whatsapp-transport-local/package-lock.json
            contracts/integration/conformance/package-lock.json
            sdks/typescript/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node ../tests/fixtures/synthetic-identity-contract.cjs
      - run: npm test
      - name: Install integration contract conformance validators
        working-directory: contracts/integration/conformance
        run: npm ci --ignore-scripts
      - name: Validate shared integration wire fixtures in JavaScript
        working-directory: contracts/integration/conformance
        run: npm test
      - name: Install TypeScript SDK build dependencies
        working-directory: sdks/typescript
        run: npm ci --ignore-scripts
      - name: Build and test the installed TypeScript SDK tarball
        working-directory: sdks/typescript
        run: npm test
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ar_test
          POSTGRES_PASSWORD: ci-only-disposable-password # gitleaks:allow
          POSTGRES_DB: attention_router_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ar_test -d attention_router_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_AUTH_ENABLED: 'true'
      DATABASE_URL: postgresql+psycopg://ar_test:ci-only-disposable-password@127.0.0.1:5432/attention_router_test # gitleaks:allow
      PUBLIC_POSTGRES_TEST_URL: postgresql+psycopg://ar_test:ci-only-disposable-password@127.0.0.1:5432/attention_router_test # gitleaks:allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          for source in $(grep -rl --include='*.list' --include='*.sources' 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null || true); do
            sudo rm -f "$source"
          done
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[dev]'
      - name: Generate ephemeral PostgreSQL job auth values
        shell: python
        run: |
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name in ("ADMIN_TOKEN", "INTERNAL_INGRESS_HMAC_SECRET"):
                  value = secrets.token_urlsafe(32)
                  print(f"::add-mask::{value}")
                  env_file.write(f"{name}={value}\n")
      - name: Verify safe configuration diagnostics
        run: python scripts/ci_settings_check.py --self-test
      - name: Load Settings with the CI auth contract
        run: python scripts/ci_settings_check.py
      - run: python -m alembic upgrade head
      - name: All PostgreSQL integration tests (no exclusions)
        run: python -m pytest -m postgres -q
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg ATTENTION_ROUTER_BUILD_SHA=${{ github.sha }} -t attention-router:ci .
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan only the candidate history, not unrelated private refs
        run: bash scripts/public_secret_scan.sh
