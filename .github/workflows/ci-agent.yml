name: CI Agent

on:
  workflow_run:
    workflows: ["Public CI", "CodeQL"]
    types: [completed]

# workflow_run executes from the default branch. Keep this workflow incapable of
# mutating repository contents until the observation-only V0 is proven.
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ci-agent-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  triage:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Triage exact PR head and upsert sticky comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_AGENT_REPO: ${{ github.repository }}
          CI_AGENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CI_AGENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python scripts/ci_agent.py
          --repo "$CI_AGENT_REPO"
          --pr-number "$CI_AGENT_PR_NUMBER"
          --head-sha "$CI_AGENT_HEAD_SHA"
