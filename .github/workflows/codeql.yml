name: CodeQL
on:
  push:
    branches: [main, public-release-candidate-20260908]
  pull_request:
    branches: [main, public-release-candidate-20260908]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    # Private staging needs Code Security entitlement and explicit enablement.
    # A skipped run is BLOCKED, not a successful security analysis.
    if: github.event.repository.private == false || vars.CODEQL_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
