name: Feature request
description: Suggest a focused, privacy-aware improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change and its boundaries.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and privacy
      options:
        - label: I will not include credentials, phone numbers, private messages, customer data, or PII.
          required: true
